name: Generate B2B Lead Report
run-name: Generate report [${{ github.event.client_payload.profile || 'danfoss' }}] [${{ github.event.client_payload.requestId || 'no-request-id' }}]

on:
  repository_dispatch:
    types: [generate-report]

permissions:
  contents: write

concurrency:
  group: lead-report-publication
  queue: max

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ github.event.client_payload.profile || 'danfoss' }}
      REQUEST_ID: ${{ github.event.client_payload.requestId || '' }}
      STATUS_EVENT_URL: ${{ github.event.client_payload.statusEventUrl || '' }}
      CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate dispatch inputs
        run: |
          case "$PROFILE" in
            danfoss|ls-electric|siemens) ;;
            *)
              echo "Unsupported profile: $PROFILE" >&2
              exit 1
              ;;
          esac

      - name: Mark run running
        continue-on-error: true
        run: |
          if [ -z "$REQUEST_ID" ] || [ -z "$STATUS_EVENT_URL" ] || [ -z "$CALLBACK_TOKEN" ]; then
            echo "Skipping status callback; requestId, callback URL, or callback token missing."
            exit 0
          fi
          cat <<EOF >/tmp/job-running.json
          {"state":"running","githubRunId":"${{ github.run_id }}","githubRunAttempt":"${{ github.run_attempt }}","githubRunUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","githubWorkflow":"${{ github.workflow }}","githubSha":"${{ github.sha }}"}
          EOF
          curl -fsS -X POST "$STATUS_EVENT_URL" \
            -H "X-Job-Callback-Token: $CALLBACK_TOKEN" \
            -H "Idempotency-Key: gh-${REQUEST_ID}-${{ github.run_id }}-${{ github.run_attempt }}-running" \
            -H "Content-Type: application/json" \
            --data @/tmp/job-running.json || true

      - name: Generate and locally commit publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          node main.js
          --profile "$PROFILE"
          --notification-requested
          --attempt "${{ github.run_attempt }}"
          --result-file /tmp/lead-pipeline-result.json

      - name: Validate typed pipeline result
        run: >-
          node scripts/inspect-lead-pipeline-result.mjs
          --result-file /tmp/lead-pipeline-result.json
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Commit, push, and verify remote publication
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/publish-lead-pipeline.mjs \
            --result-file /tmp/lead-pipeline-result.json \
            --remote origin \
            --branch master

      - name: Recover verified publication state after publisher interruption
        if: ${{ always() }}
        run: >-
          node scripts/publish-lead-pipeline.mjs
          --recover-only
          --result-file /tmp/lead-pipeline-result.json
          --remote origin
          --branch master

      - name: Notify only after verified remote publication
        if: ${{ always() }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: >-
          node scripts/notify-lead-publication.mjs
          --result-file /tmp/lead-pipeline-result.json
          --profile "$PROFILE"
          --remote origin

      - name: Record final typed pipeline result
        if: ${{ always() }}
        run: >-
          node scripts/inspect-lead-pipeline-result.mjs
          --result-file /tmp/lead-pipeline-result.json
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Persist typed pipeline result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lead-pipeline-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lead-pipeline-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Mark run completion
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -z "$REQUEST_ID" ] || [ -z "$STATUS_EVENT_URL" ] || [ -z "$CALLBACK_TOKEN" ]; then
            echo "Skipping status callback; requestId, callback URL, or callback token missing."
            exit 0
          fi
          JOB_STATE="failed"
          LAST_ERROR="GitHub job failed."
          if [ "${{ job.status }}" = "success" ]; then
            JOB_STATE="succeeded"
            LAST_ERROR=""
          elif [ "${{ job.status }}" = "cancelled" ]; then
            JOB_STATE="cancelled"
            LAST_ERROR="GitHub job was cancelled."
          fi
          RESULT_SHA="$(node -e 'try { const result = require("/tmp/lead-pipeline-result.json"); process.stdout.write(result.publication.commitSha || ""); } catch {}')"
          RESULT_SHA="${RESULT_SHA:-${{ github.sha }}}"
          cat <<EOF >/tmp/job-complete.json
          {"state":"$JOB_STATE","githubRunId":"${{ github.run_id }}","githubRunAttempt":"${{ github.run_attempt }}","githubRunUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","githubWorkflow":"${{ github.workflow }}","githubSha":"$RESULT_SHA","lastError":"$LAST_ERROR"}
          EOF
          curl -fsS -X POST "$STATUS_EVENT_URL" \
            -H "X-Job-Callback-Token: $CALLBACK_TOKEN" \
            -H "Idempotency-Key: gh-${REQUEST_ID}-${{ github.run_id }}-${{ github.run_attempt }}-terminal" \
            -H "Content-Type: application/json" \
            --data @/tmp/job-complete.json || true
