name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security dependency audit triage
        run: npm run security:audit-triage

      - name: Run outbound HTTP enrichment boundary guard
        run: npm run check:enrichment-boundary

      - name: Run enrichment fixture replay output contract
        run: npm run check:enrichment-replay

      - name: Run D1 schema consistency check
        run: npm run check:schema

      - name: Run synthetic lead-quality evaluation
        run: npm run eval:lead-quality

      - name: Run Level 1 non-production regression gate
        run: npm run check:level1

      - name: Run unit and contract tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local-only Worker E2E smoke
        run: npm run test:e2e:local
